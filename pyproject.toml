[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "receiptlab"
version = "0.1.0"
description = "Receipt document AI with reproducible training, evaluation, and human review"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "scikit-learn>=1.5,<2", "pillow>=11,<13", "pypdfium2>=4.30,<6",
  "rapidocr-onnxruntime>=1.4,<2", "numpy>=2,<3", "joblib>=1.4,<2",
]

[project.optional-dependencies]
train = ["datasets>=3,<6", "mlflow-skinny>=3,<4"]
transformer = ["torch>=2.5,<3", "transformers>=4.48,<5", "accelerate>=1,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["receiptlab*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
